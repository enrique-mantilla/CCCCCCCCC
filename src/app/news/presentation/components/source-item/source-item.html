<mat-card class="source-card">
  <mat-card-header>
    <img mat-card-avatar class="avatar" [alt]="source().name" [src]="source().urlToLogoAsString"/>
    <mat-card-title>{{ source().name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="description">{{ source().description }}</p>
    <p>
      <span class="attribute"><mat-icon fontIcon="bookmark" [aria-label]="source().category"/>{{ source().category.toUpperCase() }}</span>
      <span class="attribute"><mat-icon fontIcon="language" [aria-label]="source().language"/>{{ source().language.toUpperCase() }}</span>
      <span class="attribute"><mat-icon fontIcon="place" [aria-label]="source().country"/>{{ source().country.toUpperCase() }}</span>
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button [href]="source().urlAsString" target="_blank">{{ 'source.visit-website' | translate }}</a>
  </mat-card-actions>
</mat-card>
